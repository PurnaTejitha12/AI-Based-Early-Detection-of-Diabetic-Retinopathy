<!DOCTYPE html>
<html>
<head>
    <title>History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">
    <div class="title">📊 Prediction History</div>

    <table border="1">
        <tr>
            <th>Image</th>
            <th>Prediction</th>
            <th>Confidence</th>
            <th>Date</th>
            <th>Report</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}%</td>
            <td>{{ row[4] }}</td>
            <td><a href="/download/{{ row[5] }}">Download</a></td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
